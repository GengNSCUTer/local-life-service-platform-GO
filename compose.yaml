name: hmdp-go

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmdp}
      MYSQL_USER: ${MYSQL_USER:-hmdp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hmdp_dev_mysql}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-23306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.2
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always', '--requirepass', '${REDIS_PASSWORD:-hmdp_dev_redis}', '--min-replicas-to-write', '1', '--min-replicas-max-lag', '10']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-hmdp_dev_redis}
    ports:
      - '127.0.0.1:${REDIS_PORT:-26379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  redis-replica:
    image: redis:7.2
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-hmdp_dev_redis}
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always', '--requirepass', '${REDIS_PASSWORD:-hmdp_dev_redis}', '--masterauth', '${REDIS_PASSWORD:-hmdp_dev_redis}', '--replicaof', 'redis', '6379']
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redis-replica-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  redis-sentinel-1: &redis-sentinel
    image: redis:7.2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hmdp_dev_redis}
    command: ['sh', '-c', 'printf "port 26379\nbind 0.0.0.0\nsentinel monitor hmdp-master redis 6379 2\nsentinel auth-pass hmdp-master $$REDIS_PASSWORD\nsentinel down-after-milliseconds hmdp-master 3000\nsentinel failover-timeout hmdp-master 15000\nsentinel parallel-syncs hmdp-master 1\n" > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel']
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    ports:
      - '127.0.0.1:${REDIS_SENTINEL_1_PORT:-26380}:26379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '26379', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  redis-sentinel-2:
    <<: *redis-sentinel
    ports:
      - '127.0.0.1:${REDIS_SENTINEL_2_PORT:-26381}:26379'

  redis-sentinel-3:
    <<: *redis-sentinel
    ports:
      - '127.0.0.1:${REDIS_SENTINEL_3_PORT:-26382}:26379'

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'INTERNAL://:9092,HOST://:19092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-29092}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '127.0.0.1:${KAFKA_PORT:-29092}:19092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'kafka:9092', '--list']
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  redis-replica-data:
  kafka-data:
