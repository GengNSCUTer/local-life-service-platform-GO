services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:?set MEDIA_S3_ACCESS_KEY for local MinIO}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:?set MEDIA_S3_SECRET_KEY for local MinIO}
    ports:
      - '127.0.0.1:29000:9000'
      - '127.0.0.1:29001:9001'
    volumes:
      - minio-data:/data
volumes:
  minio-data:
