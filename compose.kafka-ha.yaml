# Use a separate Compose project so all three brokers get fresh KRaft volumes.
services:
  kafka:
    environment: &kafka-ha-env
      CLUSTER_ID: ${KAFKA_HA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
  kafka-2: &kafka-ha-broker
    image: apache/kafka:4.1.2
    environment: &second-broker-env
      <<: *kafka-ha-env
      KAFKA_NODE_ID: '2'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'INTERNAL://:9092,HOST://:19092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-2:9092,HOST://127.0.0.1:${KAFKA_2_PORT:-29093}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '127.0.0.1:${KAFKA_2_PORT:-29093}:19092'
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
  kafka-3:
    <<: *kafka-ha-broker
    environment:
      <<: *second-broker-env
      KAFKA_NODE_ID: '3'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-3:9092,HOST://127.0.0.1:${KAFKA_3_PORT:-29094}'
    ports:
      - '127.0.0.1:${KAFKA_3_PORT:-29094}:19092'
    volumes:
      - kafka-3-data:/var/lib/kafka/data

volumes:
  kafka-2-data:
  kafka-3-data:
